        <div class="pagecontent">
            <h1><a href="vacancies.html" class="pagereturnbtn">Vacancies ></a> Apply</h1>
            <br>
            <form action="MAILTO:0025000746@student.ccsw.ac.uk" method="post" enctype"text/plain">
            <h2>PERSONAL DETAILS AND CONTACT</h2>
            <fieldset>
            <div class="flex-container">
                <h3>YOUR NAME <div class="required">*</div></h3>
                <div>
                    <input type="text" name="fullname" placeholder="Enter your name..." style="font-size: 20px;" required><br>
                    <br>
                </div>
                <h3>PHONE NUMBER <div class="required">*</div></h3>
                <div>
                    <input type="text" name="phonenumber" placeholder="Enter your phone number..." style="font-size: 20px;" required><br>
                    <br>
                </div>
            </div>
            <div class="flex-container">
                <h3>EMAIL</h3>
                <div>
                    <input type="text" name="phonenumber" placeholder="Enter your email..." style="font-size: 20px;"><br>
                    <br>
                </div>
                <h3>APPLYING FOR <div class="required">*</div></h3>
                <div>
                    <select name="position" required>
                        <option value="" selected disabled hidden>Select position...</option>
                        <option value="traineewebdev">Trainee Website Developer</option>
                    </select>
                </div>
                <br>
            </div>
            </fieldset>
            <br><br>
            <h2>EDUCATION AND EMPLOYMENT</h2>
            <fieldset>
            <div class="flex-container">
                <h3>YOUR EDUCATIONAL EXPERIENCE</h3>
                <div>
                    <textarea type="text" name="eduexperience" placeholder="Enter your educational experience..."></textarea><br>
                    <br>
                </div>
                <h3>YOUR EMPLOYMENT HISTORY</h3>
                <div>
                    <textarea type="text" name="employhistory" placeholder="Enter your employment history..."></textarea><br>
                    <br>
                </div>
            </fieldset>
            <br>
            <button type="submit" class="submitbtn">Submit <div class="btnarrow">></div></button>
            </form>
        </div>
